version: '3.8'

services:
  nominatif-app:
    build: .
    ports:
      - "3005:3005"
    volumes:
      # Mount the excel file so modifications are synced in real-time
      - ./BUKU NOMINATIF JABATAN TAHUN 2026 Terbaru.xlsx:/app/BUKU NOMINATIF JABATAN TAHUN 2026 Terbaru.xlsx
      # Mount the sqlite database file to persist CRUD changes
      - ./database.sqlite:/app/database.sqlite
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3005
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - INTEGRATION_BEGAWI_URL=http://host.docker.internal:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
